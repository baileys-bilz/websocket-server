name: Deploy to Railway

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $RAILWAY_TOKEN" \
            https://backboard.railway.app/graphql/v2 \
            -X POST -H "Content-Type: application/json" \
            -d '{"query":"mutation { githubRepoDeploy(input: { projectId: \"a652683a-96db-40a8-97d8-83b3c4526153\", environmentId: \"1ff6499d-e400-41c0-994b-d4b312bf6a45\", repo: \"baileys-bilz/websocket-server\", branch: \"master\" }) }"}'
